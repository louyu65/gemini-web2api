<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Gemini Cookie Sync</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 16px; width: 380px; }
    h3 { margin: 0 0 12px; font-size: 15px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
    .label { color: #666; }
    .value { font-weight: 500; }
    .success { color: #188038; }
    .error { color: #d93025; }
    .warning { color: #e37400; }
    .skipped { color: #666; }
    .toggle { position: relative; display: inline-block; width: 34px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 20px; transition: .3s; }
    .slider::before { content: ''; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
    .toggle input:checked + .slider { background: #1a73e8; }
    .toggle input:checked + .slider::before { transform: translateX(14px); }
    button { width: 100%; margin-top: 12px; padding: 8px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #1557b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .hint { font-size: 11px; color: #999; margin-top: 8px; text-align: center; }
    #errorMsg { font-size: 12px; color: #d93025; margin-top: 4px; word-break: break-all; }
    hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    .debug-section { background: #f5f5f5; border-radius: 4px; padding: 8px; margin-top: 8px; font-size: 11px; }
    .debug-section .row { font-size: 11px; }
  </style>
</head>
<body>
  <h3>🔑 Gemini Cookie Sync</h3>

  <div class="row">
    <span class="label">服务器</span>
    <span class="value" id="serverDisplay">未配置</span>
  </div>
  <div class="row">
    <span class="label">服务状态</span>
    <span class="value" id="healthDisplay">检查中...</span>
  </div>
  <hr>
  <div class="row">
    <span class="label">上次推送</span>
    <span class="value" id="lastPushDisplay">-</span>
  </div>
  <div class="row">
    <span class="label">推送状态</span>
    <span class="value" id="statusDisplay">未知</span>
  </div>

  <div id="errorMsg"></div>

  <div class="row" style="margin-top:10px">
    <span class="label">自动推送</span>
    <label class="toggle">
      <input type="checkbox" id="autoToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="debug-section" id="debugInfo">
    <div class="row"><span class="label">Cookie 数量</span><span class="value" id="cookieCount">-</span></div>
    <button id="copyBtn" style="font-size:11px;padding:4px;margin-top:6px;background:#666">📋 复制 Cookie</button>
    <span id="copyStatus" style="font-size:11px;color:#188038;margin-left:6px;"></span>
  </div>

  <button id="pushBtn">立即推送</button>
  <div class="hint">打开扩展设置页面配置服务器地址和 Token</div>

  <script src="popup.js"></script>
</body>
</html>
